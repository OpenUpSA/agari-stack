# Podman configuration used by the local AGARI k3d/podman development stack.
#
# k3d creates the k3s node container through podman's Docker-compatible API with
# an empty HostConfig.CgroupnsMode. Podman then falls back to the *host* cgroup
# namespace, and a rootless k3s container dies instantly (exit 1, no logs) when
# it does not own its cgroup namespace. Forcing "private" here restores the same
# behaviour the podman CLI has by default, without touching the user's global
# containers.conf.
#
# Start the API service with:
#   CONTAINERS_CONF_OVERRIDE=<repo>/cluster/containers.conf \
#     podman system service --timeout=0 unix:///tmp/agari-podman/podman.sock
[containers]
cgroupns = "private"
