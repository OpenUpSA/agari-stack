{{- if .Values.indexDefaults.enabled }}
{{- $fullname := include "elasticsearch.fullname" . }}
{{- $url := printf "http://%s:%d" $fullname (int .Values.service.port) }}
{{- /*
The mapping file started as the full index body (mappings + settings) as it
exists on the server; it has since diverged - the dynamic templates were
repaired locally, see schemas/README.md. Two environment adaptations are
merged in here rather than editing the file:
  * number_of_shards / number_of_replicas come from the values below - this
    cluster has one node, so the file's replicas: 1 would leave health yellow;
  * `visibility` is pinned to keyword: the platform's access filter runs a
    terms query on it with values like "semi-private", which a dynamically
    mapped text field would tokenize into `semi`+`private` and never match.
*/}}
{{- $index := .Files.Get .Values.indexDefaults.mappingFile | fromJson }}
{{- $mappings := mergeOverwrite $index.mappings (dict "properties" (dict "visibility" (dict "type" "keyword"))) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-index-template
  labels:
    {{- include "elasticsearch.labels" . | nindent 4 }}
    app.kubernetes.io/component: index-template
  annotations:
    # Post-install/upgrade hook: runs once the Deployment is ready, so the
    # cluster normally already answers (the script retries anyway). It is
    # deleted on success - check the settings instead of the Job.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      # Deliberately *not* the service selector labels: the Job pod must not
      # become an endpoint of the Elasticsearch service.
      labels:
        {{- include "elasticsearch.labels" . | nindent 8 }}
        app.kubernetes.io/component: index-template
    spec:
      restartPolicy: OnFailure
      containers:
        - name: index-template
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              es="{{ $url }}"

              for attempt in $(seq 1 60); do
                if curl -fsS --max-time 10 "${es}/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null; then
                  break
                fi
                echo "waiting for Elasticsearch (attempt ${attempt}/60)"
                sleep 2
              done
              curl -fsS --max-time 10 "${es}/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null

              echo "applying index template '{{ .Values.indexDefaults.template }}'"
              curl -fsS -X PUT \
                -H 'Content-Type: application/json' \
                --data-binary @- \
                "${es}/_index_template/{{ .Values.indexDefaults.template }}" <<'JSON'
              {
                "index_patterns": ["{{ .Values.indexDefaults.pattern }}"],
                "template": {
                  "settings": {{ mergeOverwrite $index.settings (dict "number_of_shards" (int .Values.indexDefaults.numberOfShards) "number_of_replicas" (int .Values.indexDefaults.numberOfReplicas)) | toJson }},
                  "mappings": {{ $mappings | toJson }}
                }
              }
              JSON

              # Indices that already exist keep their settings, so align them too.
              # A wildcard without matches answers 404 - that is not a failure.
              status=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
                -H 'Content-Type: application/json' \
                --data-binary '{"index":{"number_of_replicas":{{ .Values.indexDefaults.numberOfReplicas }}}}' \
                "${es}/{{ .Values.indexDefaults.pattern }}/_settings")
              if [ "${status}" = "200" ]; then
                echo "updated replicas of existing {{ .Values.indexDefaults.pattern }} indices"
              else
                echo "no existing {{ .Values.indexDefaults.pattern }} index to update (HTTP ${status})"
              fi

              # Indices created before this template keep the mappings they
              # were born with, so merge the current ones in as well. PUT
              # _mapping only ever adds new fields - existing definitions are
              # never altered - which makes this safe to repeat.
              for idx in $(curl -fsS --max-time 10 \
                "${es}/_cat/indices/{{ .Values.indexDefaults.pattern }}?h=index" 2>/dev/null || true); do
                echo "merging mappings into ${idx}"
                curl -sS -o /dev/null -w '  HTTP %{http_code}\n' -X PUT \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "${es}/${idx}/_mapping" <<'MAPPING' || echo "  mapping merge failed"
{{ $mappings | toJson | nindent 14 }}
              MAPPING
              done

              curl -fsS --max-time 10 "${es}/_cluster/health?pretty"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
{{- end }}
