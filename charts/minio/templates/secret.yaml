{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "minio.secretName" . }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "minio.secretKey.accessKey" . }}: {{ .Values.auth.accessKey | quote }}
  {{ include "minio.secretKey.secretKey" . }}: {{ .Values.auth.secretKey | quote }}
{{- end }}
