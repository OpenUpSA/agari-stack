# Values for the local MinIO chart.
#
# Tag pinned to match the legacy agari-helm chart. Newer MinIO releases drop
# features that older clients rely on, and this stack is meant to mirror the
# rest of AGARI rather than chase upstream.

nameOverride: ""
fullnameOverride: ""

# MinIO no longer publishes its server on Docker Hub, and both quay.io/minio/minio
# and registry.min.io now require a (paid) login, so the server comes from the
# archived Bitnami build. It bundles the matching `mc` client, which is why the
# bucket setup Job below reuses the very same image.
image:
  repository: docker.io/bitnamilegacy/minio
  tag: "2025.5.24-debian-12-r5"
  pullPolicy: IfNotPresent
  # The Bitnami entrypoint expects Bitnami-specific variables, so bypass it and
  # run the server binary directly. Point this (and `mcImage.binary`) at the
  # right path when you swap in another image.
  command:
    - /opt/bitnami/minio/bin/minio

mcImage:
  repository: docker.io/bitnamilegacy/minio
  tag: "2025.5.24-debian-12-r5"
  pullPolicy: IfNotPresent
  binary: /opt/bitnami/minio-client/bin/mc

service:
  type: ClusterIP
  port: 9000
  consolePort: 9001

# Host port the k3d load balancer publishes HTTP on (8080 for the local
# cluster). Only used to build absolute URLs such as the console redirect.
externalPort: 8080

# Root credentials. `accessKey`/`secretKey` feed the bundled Secret unless
# `existingSecret` is set.
auth:
  accessKey: agari
  secretKey: agari12345
  existingSecret: ""
  secretKeys:
    accessKey: accessKey
    secretKey: secretKey

# Buckets created by the setup Job. AGARI's object storage bucket must exist
# before the API accepts uploads.
buckets:
  - agari-data

bucketSetup:
  enabled: true
  # How long the Job keeps retrying while MinIO is still starting up.
  waitTimeoutSeconds: 300
  backoffLimit: 4
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# API ingress - this is what OBJECT_STORAGE_PUBLIC_ENDPOINT must point at, so
# that presigned download URLs generated by the API work from the browser.
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/proxy-body-size: "1000m"
  host: minio.agari.localhost
  path: /
  pathType: Prefix
  tls: []

# MinIO's web console (mostly useful for poking at objects by hand).
consoleIngress:
  enabled: true
  className: traefik
  annotations: {}
  host: minio-console.agari.localhost
  path: /
  pathType: Prefix
  tls: []

persistence:
  enabled: true
  size: 10Gi
  accessMode: ReadWriteOnce
  storageClass: ""
  keepOnDelete: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# The Bitnami image runs as uid 1001 / gid 0 (their files are group-writable).
# fsGroup 0 makes the kubelet prepare the data volume for that group as well, so
# the server can write to a freshly provisioned volume whatever mode it starts
# with.
podSecurityContext:
  fsGroup: 0

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 0
  allowPrivilegeEscalation: false

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
