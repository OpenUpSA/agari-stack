{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.secretName" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "postgres.secretKey.username" . }}: {{ .Values.auth.username | quote }}
  {{ include "postgres.secretKey.password" . }}: {{ .Values.auth.password | quote }}
  {{ include "postgres.secretKey.database" . }}: {{ .Values.auth.database | quote }}
{{- end }}
