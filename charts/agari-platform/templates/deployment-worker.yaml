apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agari-platform.fullname" . }}-worker
  labels:
    {{- include "agari-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "agari-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "agari-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "agari-platform.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if and .Values.migrations.enabled .Values.migrations.waitForSchema }}
      # `manage.py agari_worker` quits at startup while the task tables are
      # missing, so wait for the migration Job instead of crash-looping.
      initContainers:
        {{- include "agari-platform.waitForSchemaInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "agari-platform.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- if .Values.worker.command }}
            {{- toYaml .Values.worker.command | nindent 12 }}
            {{- else }}
            - python
            - -u
            - manage.py
            - agari_worker
            {{- /* Queues default to the TASKS backend's QUEUES option. */}}
            {{- if .Values.worker.queues }}
            - --queue-name
            - {{ .Values.worker.queues | quote }}
            {{- end }}
            {{- if .Values.worker.excludeQueues }}
            - --exclude-queues
            - {{ .Values.worker.excludeQueues | quote }}
            {{- end }}
            {{- if .Values.worker.pollIntervalSeconds }}
            - --interval
            - {{ .Values.worker.pollIntervalSeconds | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.worker.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "agari-platform.fullname" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "agari-platform.secretEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            {{- include "agari-platform.jwtVolumeMount" . | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "agari-platform.jwtVolume" . | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
