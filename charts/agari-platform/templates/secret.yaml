{{- if not .Values.secret.existingSecret }}
{{/*
The chart-managed Secret. Set `secret.existingSecret` to supply your own
instead; it must then provide at least

  djangoSecretKey, databasePassword, objectStorageAccessKey, objectStorageSecretKey

and optionally elasticsearchPassword, keycloakClientSecret, keycloakClientSecrets,
sendgridApiKey, emailPassword, adminPassword and jwt-private-key.pem.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agari-platform.secretName" . }}
  labels:
    {{- include "agari-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  djangoSecretKey: {{ include "agari-platform.djangoSecretKey" . | quote }}
  databasePassword: {{ required "secret.databasePassword (or secret.existingSecret) is required" .Values.secret.databasePassword | quote }}
  objectStorageAccessKey: {{ required "secret.objectStorageAccessKey (or secret.existingSecret) is required" .Values.secret.objectStorageAccessKey | quote }}
  objectStorageSecretKey: {{ required "secret.objectStorageSecretKey (or secret.existingSecret) is required" .Values.secret.objectStorageSecretKey | quote }}
  elasticsearchPassword: {{ .Values.secret.elasticsearchPassword | quote }}
  keycloakClientSecret: {{ .Values.secret.keycloakClientSecret | quote }}
  keycloakClientSecrets: {{ .Values.secret.keycloakClientSecrets | toJson | quote }}
  sendgridApiKey: {{ .Values.secret.sendgridApiKey | quote }}
  emailPassword: {{ .Values.secret.emailPassword | quote }}
  adminPassword: {{ .Values.secret.adminPassword | quote }}
{{- if include "agari-platform.jwtEnabled" . }}
  jwt-private-key.pem: {{ required "secret.jwtPrivateKey (or a key named jwt-private-key.pem in secret.existingSecret) is required when config.jwt.signingAlgorithm starts with RS" .Values.secret.jwtPrivateKey | quote }}
{{- end }}
{{- end }}
