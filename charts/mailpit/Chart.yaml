apiVersion: v2
name: mailpit
description: |
  Mailpit for the local AGARI stack: a tiny SMTP server that accepts every
  message, delivers nothing, and keeps it in a web UI plus a JSON API. Magic
  links and invitations are readable at http://mailpit.agari.localhost:8080,
  so any address works - dummy ones included.
type: application
version: 0.1.0
appVersion: "1.31.4"
keywords:
  - agari
  - mailpit
  - smtp
  - email
  - mail-catcher
  - local-development
